<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陳昭銘 CHEN CHAO MING — 3D 建模作品集</title>
<meta name="description" content="陳昭銘的互動式 3D 作品集：角色、載具、場景道具與數位雕刻。每個模型都能在網頁上旋轉、拆解、切成線框檢查。">
<meta name="theme-color" content="#06070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="互動式 3D 作品展示"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- 載入畫面 -->
<div id="loader">
  <div class="loader-inner">
    <div class="loader-count" id="loader-pct">000</div>
    <div class="loader-name">CHEN CHAO MING — 3D MODELING</div>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <div class="loader-meta"><span id="loader-text">載入 8 個模型 · 219 萬個三角面</span><span>LOADING</span></div>
  </div>
</div>

<!-- 頂部導覽 -->
<header id="topbar">
  <a class="brand" href="#top" data-jump="0"><b>陳昭銘</b><span>3D ARTIST</span></a>
  <nav>
    <a href="#works" data-jump="works">作品</a>
    <a href="#gallery" data-jump="gallery">藝廊</a>
    <a href="#about" data-jump="about">服務</a>
    <a class="cta" href="#contact" data-jump="contact">開始委託</a>
  </nav>
</header>

<div id="progress" aria-hidden="true"><i></i></div>

<!-- 左側章節軌道 -->
<aside id="rail" aria-label="章節"></aside>

<!-- 目前作品資訊 + 檢視模式 -->
<div id="hud">
  <div id="hud-work"><span id="hud-no">01</span><span id="hud-sep">/</span><span id="hud-total">08</span><b id="hud-title">飛行艇</b></div>
  <div id="modes" role="group" aria-label="檢視模式">
    <button data-mode="auto" class="on">自動</button>
    <button data-mode="shaded">上色</button>
    <button data-mode="clay">白模</button>
    <button data-mode="wire">線框</button>
    <span class="sep"></span>
    <button id="explode" title="爆炸拆解圖（快捷鍵 X）">拆解</button>
  </div>
  <div id="hint"><i class="ico-drag"></i>拖曳旋轉　·　捲動前進　·　X 拆解</div>
</div>

<!-- 文字面板（由 JS 依運鏡腳本產生） -->
<main id="panels"></main>

<!-- 圖片燈箱 -->
<div id="lightbox" hidden>
  <button id="lb-close" aria-label="關閉">×</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption><b id="lb-title"></b><span id="lb-note"></span><div id="lb-alts"></div></figcaption>
  </figure>
</div>

<!-- 捲動長度（實際內容為 fixed 面板） -->
<div id="scroll-space"></div>

<noscript><p class="nojs">這個作品集需要啟用 JavaScript 才能瀏覽 3D 內容。聯絡信箱：jerry216066@gmail.com</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
